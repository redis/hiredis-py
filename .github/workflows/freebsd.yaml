name: FreeBSD

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.rst'
      - '**/*.md'
    branches:
      - master
      - '[0-9].[0-9]'
  pull_request:
    branches:
      - master
      - '[0-9].[0-9]'

permissions:
  contents: read  #  to fetch code (actions/checkout)

env:
  # Fork pull requests and Dependabot runs do not receive the Tracebit secret.
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:

   run-tests:
     runs-on: ubuntu-latest
     timeout-minutes: 30
     env:
       ACTIONS_ALLOW_UNSECURE_COMMANDS: true
     name: Python ${{ matrix.python-version }} FreeBSD
     steps:
       - uses: actions/checkout@v6
         with:
           submodules: recursive
       - name: Configure credentials
         if: env.TRACEBIT_ENABLED == 'true'
         uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
         with:
           customer-id: sha5oz2y
           api-token: ${{ secrets.SECURITY_API_TOKEN }}
           profile: administrator
           profile-region: us-east-1
           async: true
       - name: build and test
         uses: vmactions/freebsd-vm@v1
         with:
           envs: 'ACTIONS_ALLOW_UNSECURE_COMMANDS'
           usesh: true
           sync: rsync
           copyback: false
           prepare: pkg install -y bash curl python311
           run: |
             curl -s https://bootstrap.pypa.io/get-pip.py -o get-pip.py
             python3.11 get-pip.py
             /usr/local/bin/pip install -U pip setuptools wheel
             sed '5,6d' dev_requirements.txt > dev_requirements_without_memray.txt
             /usr/local/bin/pip install -r dev_requirements_without_memray.txt
             /usr/local/bin/python3.11 setup.py build_ext --inplace
             /usr/local/bin/python3.11 -m pytest
             /usr/local/bin/python3.11 setup.py bdist_wheel
