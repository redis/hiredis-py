name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.rst'
      - '**/*.md'
    branches:
      - master
      - 'v[0-9].[0-9]'
  pull_request:
    branches:
      - master
      - 'v[0-9].[0-9]'

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:

   run-tests:
     runs-on: ${{matrix.os}}
     timeout-minutes: 30
     strategy:
       max-parallel: 15
       matrix:
         python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15', 'pypy-3.9', 'pypy-3.10', 'pypy-3.11']
         os: ['ubuntu-24.04', 'windows-latest', 'macos-latest']
         include:
           - os: 'windows-11-arm'
             python-version: '3.11'
           - os: 'windows-11-arm'
             python-version: '3.14'
       fail-fast: false
     env:
       ACTIONS_ALLOW_UNSECURE_COMMANDS: true
     name: Python ${{ matrix.python-version }} ${{matrix.os}}
     steps:
       - uses: actions/checkout@v6
         with:
           submodules: recursive
       - uses: actions/setup-python@v6
         with:
           python-version: ${{ matrix.python-version }}
           cache: 'pip'
           cache-dependency-path: dev_requirements.txt
       - name: Install memray deps
         if: ${{ matrix.os == 'ubuntu-24.04' }}
         run: |
           sudo apt-get update -qq
           sudo apt-get install build-essential python3-dev libdebuginfod-dev libunwind-dev liblz4-dev -y -qq
       - name: run tests
         env:
           MACOSX_DEPLOYMENT_TARGET: 10.14
         run: |
           pip install -U pip setuptools wheel
           pip install -r dev_requirements.txt
           python setup.py build_ext --inplace
           python -m pytest
       - name: run tests with assertions enabled
         if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12' }}
         run: |
           python setup.py build_ext -UNDEBUG --inplace --force
           python -m pytest
       - name: build and install the wheel
         run: |
           python setup.py bdist_wheel

   run-tests-free-threaded:
     runs-on: ${{matrix.os}}
     timeout-minutes: 30
     strategy:
       matrix:
         python-version: ['3.13t', '3.14t', '3.15t']
         os: ['ubuntu-24.04', 'windows-latest', 'macos-latest']
       fail-fast: false
     name: Python ${{ matrix.python-version }} ${{matrix.os}}
     steps:
       - uses: actions/checkout@v6
         with:
           submodules: recursive
       - uses: actions/setup-python@v6
         with:
           python-version: ${{ matrix.python-version }}
       - name: build and run tests without the GIL
         env:
           # Keep the GIL off for the whole run so the concurrency tests are
           # meaningful. test_import_does_not_enable_gil ignores this and checks
           # that importing hiredis does not turn the GIL back on by itself.
           PYTHON_GIL: 0
         run: |
           pip install -U pip setuptools wheel pytest
           python setup.py build_ext --inplace
           python -m pytest
